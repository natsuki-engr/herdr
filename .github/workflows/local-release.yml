name: Local release

# Tag-triggered so master can stay a pristine upstream mirror. workflow_dispatch
# would require this file to exist on the default branch.
on:
  push:
    tags:
      - 'v*-local.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  release:
    runs-on: macos-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin

      # Upstream ships a patched zig@0.15 through Homebrew. The vanilla 0.15.2
      # tarball cannot link against the macOS 26 SDK.
      - name: Install patched Zig
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Install macOS build tools
        run: brew install cmake ninja

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package artifact
        run: |
          cp target/aarch64-apple-darwin/release/herdr herdr-macos-aarch64
          shasum -a 256 herdr-macos-aarch64 | tee SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256="$(cut -d' ' -f1 SHA256SUMS.txt)"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Local build of \`$GITHUB_SHA\`.

          Formula values:

          - url: https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/herdr-macos-aarch64
          - sha256: \`$sha256\`" \
            herdr-macos-aarch64 SHA256SUMS.txt
